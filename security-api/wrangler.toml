name = "zeroclick-security-lab"
main = "worker.js"
compatibility_date = "2026-10-31"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.traces.issues]
enabled = false
