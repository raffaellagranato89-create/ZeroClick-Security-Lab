<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test SENTINEL SECURITY</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:680px;margin:40px auto;padding:0 18px;line-height:1.5}
button{font:inherit;padding:12px 18px;border:0;border-radius:8px;background:#155eef;color:white}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f7;padding:14px;border-radius:8px}
small{color:#555}
</style>
</head>
<body>
<h1>Test servizio SENTINEL SECURITY</h1>
<p>Questo test invia al Worker un indirizzo pubblico innocuo (<code>https://example.com</code>). Non apre il sito e non richiede credenziali.</p>
<button id="run">Esegui test POST</button>
<p id="status" role="status">In attesa del test.</p>
<pre id="result">Il risultato apparirà qui.</pre>
<script>
const button=document.getElementById('run');
button.addEventListener('click',async()=>{
  button.disabled=true;
  document.getElementById('status').textContent='Test in corso…';
  document.getElementById('result').textContent='';
  try{
    const response=await fetch('https://zeroclick-security-lab.raffaellagranato89.workers.dev',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:'https://example.com'})
    });
    const body=await response.text();
    document.getElementById('status').textContent='Risposta HTTP: '+response.status;
    try{document.getElementById('result').textContent=JSON.stringify(JSON.parse(body),null,2);}
    catch{document.getElementById('result').textContent=body;}
  }catch(error){
    document.getElementById('status').textContent='Test non riuscito: '+error.message;
    document.getElementById('result').textContent='Possibile problema di rete o CORS.';
  }finally{button.disabled=false;}
});
</script>
</body>
</html>
